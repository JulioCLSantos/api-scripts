<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>API de Scripts</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f172a; color: #e2e8f0; font-family: Arial, sans-serif; }
    header { background: #1e293b; padding: 20px 40px; border-bottom: 2px solid #6366f1; }
    header h1 { color: #6366f1; font-size: 24px; }
    header p { color: #94a3b8; font-size: 14px; }
    .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    .card h2 { color: #6366f1; margin-bottom: 16px; font-size: 18px; }
    input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; margin-bottom: 12px; font-size: 14px; }
    button { padding: 10px 24px; border-radius: 8px; border: none; background: #6366f1; color: white; cursor: pointer; font-size: 14px; }
    button:hover { background: #4f46e5; }
    .resultado { margin-top: 16px; background: #0f172a; border-radius: 8px; padding: 16px; font-size: 13px; color: #94a3b8; min-height: 60px; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #0f172a; color: #6366f1; padding: 10px; text-align: left; }
    td { padding: 10px; border-bottom: 1px solid #334155; font-size: 13px; color: #94a3b8; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; background: #6366f1; color: white; }
  </style>
</head>
<body>

<header>
  <h1>🚀 API de Execução de Scripts</h1>
  <p>Gerencie e execute seus scripts automaticamente</p>
</header>

<div class="container">

  <!-- TOKEN -->
  <div class="card">
    <h2>🔐 Autenticação</h2>
    <input type="text" id="token" placeholder="Digite seu token aqui..." value="meutoken123">
  </div>

  <!-- LISTAR SCRIPTS -->
  <div class="card">
    <h2>📋 Scripts Disponíveis</h2>
    <button onclick="listarScripts()">Listar Scripts</button>
    <div class="resultado" id="resultadoScripts">Clique no botão para listar...</div>
  </div>

  <!-- EXECUTAR SCRIPT -->
  <div class="card">
    <h2>▶️ Executar Script</h2>
    <input type="text" id="nomeScript" placeholder="Nome do script (ex: teste.sh)">
    <input type="text" id="parametros" placeholder="Parâmetros (opcional, ex: cliente1)">
    <button onclick="executarScript()">Executar</button>
    <div class="resultado" id="resultadoExecutar">O resultado aparecerá aqui...</div>
  </div>

  <!-- LOGS -->
  <div class="card">
    <h2>📊 Histórico de Execuções</h2>
    <button onclick="verLogs()">Ver Logs</button>
    <div class="resultado" id="resultadoLogs">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Script</th>
            <th>Parâmetros</th>
            <th>Resultado</th>
            <th>Horário</th>
          </tr>
        </thead>
        <tbody id="tabelaLogs"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const BASE = "http://localhost:8000";

  function getToken() {
    return document.getElementById("token").value;
  }

  async function listarScripts() {
    const res = await fetch(`${BASE}/scripts`, { headers: { token: getToken() } });
    const data = await res.json();
    document.getElementById("resultadoScripts").innerHTML = 
      data.scripts.map(s => `<span class="badge">${s}</span> `).join("") || "Nenhum script encontrado";
  }

  async function executarScript() {
    const nome = document.getElementById("nomeScript").value;
    const parametros = document.getElementById("parametros").value;
    const res = await fetch(`${BASE}/executar?nome=${nome}&parametros=${parametros}`, {
      method: "POST", headers: { token: getToken() }
    });
    const data = await res.json();
    document.getElementById("resultadoExecutar").innerText = data.resultado || data.detail;
  }

  async function verLogs() {
    const res = await fetch(`${BASE}/logs`, { headers: { token: getToken() } });
    const data = await res.json();
    document.getElementById("tabelaLogs").innerHTML = data.logs.map(log =>
      `<tr><td>${log[0]}</td><td>${log[1]}</td><td>${log[2]}</td><td>${log[3]}</td><td>${log[4]}</td></tr>`
    ).join("");
  }
</script>

</body>
</html>
